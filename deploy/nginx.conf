worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  text/plain;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens off;

    # Le conteneur tourne en lecture seule et sans privilège : tout ce que nginx écrit
    # doit atterrir dans le tmpfs monté sur /tmp.
    client_body_temp_path /tmp/nginx-body;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    proxy_temp_path       /tmp/nginx-proxy;
    scgi_temp_path        /tmp/nginx-scgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;

    # Sans real_ip, /u/ip ne renverrait que l'adresse interne du proxy. Le bloc privé
    # entier plutôt que le sous-réseau du bridge : docker l'alloue tout seul et le
    # changerait en silence, et sur un réseau --internal seul kamal-proxy peut nous
    # joindre — il n'y a personne d'autre à qui accorder cette confiance.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Chaque appel à /u/ fork un shell : sans plafond, fortune et pwgen deviennent
    # un levier de charge gratuit pour n'importe qui.
    limit_req_zone $binary_remote_addr zone=cgi:1m rate=2r/s;
    limit_req_status 429;

    server {
        listen 8080;
        server_name _;
        root /var/www/utils;
        index index.html;
        charset utf-8;

        location / {
        }

        location ~ ^/u/ {
            limit_req zone=cgi burst=10 nodelay;

            # fcgiwrap chdir dans le dossier du script : les wrappers en dépendent pour
            # sourcer ./_200-headers.sh et pour que cat ne lise que ses voisins.
            rewrite ^/u/(.*)$ /$1 break;
            include fastcgi_params;
            fastcgi_pass unix:/tmp/fcgiwrap.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/utils/wrappers$fastcgi_script_name;
        }
    }
}
